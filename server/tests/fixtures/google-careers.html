<!DOCTYPE html>
<html><body><script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["128741187606454982", "Product Manager, Ads Customer Lifecycle", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2Fckcuz2lhP0LVrXH4kpvsS19pAZif8MlT2SH7xKUM8aeeAEjsA9yzvgnPX9jRrQ_idJ99fBrx6G6anT-_s5uWiE21C95mR_F378Cv6Erx3JJaS0--FEBqdds_WL6B0Jw%3D%3D_V2&loc=IN&title=Product+Manager", [null, "<ul>\n<li>Drive end-to-end product strategy and execution to simplify ads product linking and supercharge link utilization across Google Ads, YouTube, Merchant Center, and Data Manager serving as the AI-agent SME to expand Product Linking skills into Google's owned and third-party agentic surfaces.</li>\n<li>Orchestrate cross-functional delivery by partnering closely with Engineering, UX, Data Science, Legal, Marketing, and Sales teams across AP onboarding, incentives, hedwig/email, and mobile app to translate ambiguous platform challenges into clear PRDs, roadmaps, and measurable business outcomes.</li>\n<li>Lead definition and execution of multi-account (MCC) initiatives, delivering proactive cross-account insights, controlled automation, and stronger security posture against account takeover risks.</li>\n<li>Guide enterprise sustainability and Ads ToS compliance as the Ads Platform PM for Ads Carbon Reporting and Sustainability leading the upcoming Carbon Reporting AI Agent and managing global Ads Terms of service regulatory rollouts.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>3 years of experience in product management or related technical role.</li>\n<li>1 year of experience taking technical products from conception to launch (e.g., ideation to execution, end-to-end, 0 to 1, etc.).</li>\n<li>Experience defining product vision, authoring product requirements (PRDs), and working with engineering and UX teams through the full product lifecycle.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree in a technology or business related field.</li>\n<li>Experience building or integrating Agentic AI workflows (e.g., LLM-powered assistants, tool-use/skills, automated onboarding/troubleshooting agents, or Agent to Agent communication using MCP).</li>\n<li>Experience with digital advertising platforms (Google Ads, YouTube, Merchant Center), data integrations/connectors, or large-scale B2B/Enterprise SaaS account hierarchies and identity/security management.</li>\n<li>Experience managing ambiguity, proactively anticipating technical or operational roadblocks, and turning complex platform constraints into seamless customer experiences.<br></li>\n<li>Demonstrated ability to balance high-velocity growth initiatives (e.g., funnel conversion, incentives, contactability) with mission-critical platform reliability, security, and global regulatory compliance.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"], "Bengaluru", "560038", "KA", "IN"]], [null, "<p>At Google, we put our users first. The world is always changing, so we need Product Managers who are continuously adapting and excited to work on products that affect millions of people every day. <br><br>In this role, you will work cross-functionally to guide products from conception to launch by connecting the technical and business worlds. You can break down complex problems into steps that drive product development.<br><br>One of the many reasons Google consistently brings innovative, world-changing products to market is because of the collaborative work we do in Product Management. Our team works closely with creative engineers, designers, marketers, etc. to help design and develop technologies that improve access to the world's information.  We're responsible for guiding products throughout the execution cycle, focusing specifically on analyzing, positioning, packaging, promoting, and tailoring our solutions to our users.<br></p>\n<p>This team builds foundational account infrastructure, cross-product data connectivity, and experiences that power every Google Ads advertiser—from SMBs to global enterprises and agencies. Our strategy focuses on three core pillars to eliminate operational fatigue and drive sustainable platform growth: Connectedness and Operational Setup (Foundation): Establishing a bi-directional data ecosystem that bridges Google Ads with relevant tools to eliminate friction, enabling automated data flows to directly fuel campaign optimization. Intelligent and Proactive Ecosystem (Value): Invest in proactive, AI-driven experiences and agentic actionability within the advertiser’s daily tools, supported by an AI-powered mobile co-pilot and interactive notifications to accelerate user growth and engagement. Secure and Simplified Infrastructure (Enabler): Hardening infrastructure by simplifying MCC hierarchies (both structurally and perceptibly), and enforcing least-privilege access on accounts with right controls to address security vulnerabilities.</p><p>Google Ads is at the forefront of AI innovation, applying cutting-edge machine learning and Generative AI models like Gemini to power a multi-billion dollar global business.</p><p>Our work directly impacts billions of users by protecting users from harm, improving ad quality, and optimizing campaigns for advertiser return-on-investment. We foster a culture of deep collaboration, partnering closely with teams like Google Research and DeepMind to solve complex challenges. Join us to work on state-of-the-art AI, take on problems at an unparalleled scale, and build the next generation of advertising technology.</p>"], [2, 3], [1795171090, 978000000], [1795171090, 978000000], [1795171093, 252000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>3 years of experience in product management or related technical role.</li>\n<li>1 year of experience taking technical products from conception to launch (e.g., ideation to execution, end-to-end, 0 to 1, etc.).</li>\n<li>Experience defining product vision, authoring product requirements (PRDs), and working with engineering and UX teams through the full product lifecycle.</li>\n</ul>"], 2], ["100288352120382150", "Web Solutions Engineer, YouTube India Technology and Insights", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckWzrCZF00sDrkRO2n-TM1BueiMPljpHoXk85-36fgfzMEjsA9yzvglfUxWMI37G6XzZaVvKmX9-K9Mm5P59_W_qqDiu76_Ud8Htg1ZOAxsnWRE5iSZJtJM3jfXbL4A%3D%3D_V2&loc=IN&title=Web+Solutions+Engineer", [null, "<ul>\n<li>Lead the end-to-end design, implementation, and launch of full-stack applications and backend services that power agreements term extraction, partner payment configuration, and agreement analytics for YouTube.</li>\n<li>Architect and ship AI-powered workflows and agents that automate contract ingestion, validate payment setups, and support business teams across the agreement lifecycle.</li>\n<li>Partner with product managers, tech leads, and stakeholders across Business Development, Finance, and Operations to define technical requirements and translate complex partner agreement structures into scalable architectures.</li>\n<li>Author technical design documents, lead code and design reviews across Java, Python, TypeScript/Angular, and SQL, and set engineering standards for automated testing and system reliability.</li>\n<li>Mentor fellow engineers and drive cross-system improvements that increase payment accuracy, operating efficiency, and engineering velocity.<br></li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Computer Science, Electrical Engineering, Math or related quantitative field, or equivalent practical experience in software development.</li>\n<li>6 years of experience in full-stack software development and system architecture.</li>\n<li>Experience leading the technical design and end-to-end delivery of multi-component web applications and backend services using Java, Python, C++, and TypeScript/Angular.<br></li>\n<li>Experience designing data models and optimizing queries for relational databases using SQL.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience working directly with product managers and cross-functional stakeholders to translate ambiguous business requirements into technical designs.</li>\n<li>Experience with agreement management, financial or payment systems, or building production LLM and AI agent workflows.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ad872500-709d-4a93-97e3-76be227f77a1", null, "YouTube", "en-US", [["Bengaluru, Karnataka, India", ["Chikpete Main Rd, Ragipet, Dodpete, Nagarathpete, Bengaluru, Karnataka 560053, India"], "Bengaluru", "560053", "KA", "IN"]], [null, "<p>As part of YouTube Technology and Insights, our team builds the systems that make sure YouTube accurately pays its enterprise music, TV, and streaming-device partners, turning signed agreements into structured terms and reliable payments. Our goal is to deliver technology that empowers YouTube to secure and execute high value agreements.</p><p>To achieve our goal, we are leveraging AI to extract agreement terms and automate agreement implementation. We are also building AI agents that support YouTube business across the agreement lifecycle, from analysis to negotiation to execution.<br><br>Join us to build AI-driven, consumer-grade tools for the people who negotiate and run YouTube's biggest agreements.<br><br>Google's Web Solutions Engineers build software solutions for complex business problems. On the YouTube Deals and Payment Systems team, you will build full-stack applications, distributed backend services, and AI agents that turn YouTube's enterprise partner agreements into accurate, automated payments and agreement insights.<br><br>You care about software design principles, code quality, and automated test coverage, and you enjoy working across the stack using Java, Python, TypeScript/Angular, SQL, and Google's internal cloud and AI infrastructure. Because our systems sit at the intersection of engineering, product, finance, and partner agreements, you will work closely with engineers, product managers, and business stakeholders across global offices to take features from initial design to production launch.</p>"], [2], [1794928165, 985000000], [1794928165, 985000000], [1794928166, 94000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree in Computer Science, Electrical Engineering, Math or related quantitative field, or equivalent practical experience in software development.</li>\n<li>6 years of experience in full-stack software development and system architecture.</li>\n<li>Experience leading the technical design and end-to-end delivery of multi-component web applications and backend services using Java, Python, C++, and TypeScript/Angular.<br></li>\n<li>Experience designing data models and optimizing queries for relational databases using SQL.</li>\n</ul>"], 2], ["110657296526123718", "Web Solutions Engineer, YouTube Technology and Insights", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckdkFwunKCVZdk8n_PyeG_rIvQBOcEc3mJQyVJf0ba2m5EjsA9yzvgpmiedvJ-HfnJxwYTt8oYQZWVQ-CezOvqjWg-LSWdNHmxOSlaMpFyzecTm7P3dlbkL6clCcwKA%3D%3D_V2&loc=IN&title=Web+Solutions+Engineer", [null, "<ul>\n<li>Design, build, and deploy scalable full-stack applications and back-end services that power agreement term extraction, partner payment configuration, and agreement analytics for YouTube.</li>\n<li>Build and integrate AI-powered workflows and agents that automate agreement ingestion, validate payment setups, and support business teams across the agreement lifecycle.</li>\n<li>Collaborate with product managers, tech leads, and business stakeholders across business development, finance, and operations to translate complex partner agreement structures into reliable software.</li>\n<li>Write and review technical design documents and production code in Java, Python, TypeScript/Angular, and SQL, maintaining automated test coverage and system reliability.</li>\n<li>Analyze, debug, and optimize existing systems to improve accuracy, operating efficiency, and developer velocity.<br></li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Computer Science, Electrical Engineering, Math or a related quantitative field, or equivalent practical experience in software development.</li>\n<li>4 years of experience in full-stack software development and system design.</li>\n<li>Experience with back-end languages (e.g. Java, Python, or C++).</li>\n<li>Experience with front-end languages (e.g. JavaScript or TypeScript).</li>\n<li>Experience working with database technologies (e.g. SQL, NoSQL).</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li><div>Experience building web applications with component frameworks (such as Angular or React) and designing back-end APIs and protocol buffers.</div></li>\n<li><div>Experience designing relational database schemas and writing or optimizing SQL queries.</div></li>\n<li><div>Experience taking software features from technical specification through code review, automated testing, continuous integration, and production launch.</div></li>\n<li><div>Experience collaborating with product managers and cross-functional stakeholders to translate complex business requirements into maintainable software.</div></li>\n<li>Experience with contract management, financial or payment systems, or building LLM and AI agent workflows.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ad872500-709d-4a93-97e3-76be227f77a1", null, "YouTube", "en-US", [["Bengaluru, Karnataka, India", ["Chikpete Main Rd, Ragipet, Dodpete, Nagarathpete, Bengaluru, Karnataka 560053, India"], "Bengaluru", "560053", "KA", "IN"]], [null, "<p>Part of YouTube Technology and Insights, our team builds the systems that make sure YouTube accurately pays its enterprise music, TV, and streaming-device partners, turning signed agreements into structured terms and reliable payments. Our goal is to deliver technology that empowers YouTube to secure and execute high value agreements. To achieve our goal, we are leveraging AI to extract agreement terms and automate agreement implementation. We are also building AI agents that support YouTube business across the agreement lifecycle, from analysis to negotiation to execution.</p><p>In this role, you will build AI-driven, consumer-grade tools for the people who negotiate and run YouTube's biggest agreements.</p><p><b></b></p>"], [2], [1794924598, 793000000], [1794924598, 793000000], [1794924598, 863000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree in Computer Science, Electrical Engineering, Math or a related quantitative field, or equivalent practical experience in software development.</li>\n<li>4 years of experience in full-stack software development and system design.</li>\n<li>Experience with back-end languages (e.g. Java, Python, or C++).</li>\n<li>Experience with front-end languages (e.g. JavaScript or TypeScript).</li>\n<li>Experience working with database technologies (e.g. SQL, NoSQL).</li>\n</ul>"], 2], ["93875038234518214", "Solutions Architect, Industry Solutions, Healthcare and Life Sciences", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckfN9BusmvIE5q3lB0d3-lqxKxO7uEtYwyvD1eWiZeEkkEjsA9yzvgll0jlabKiLibGW3frDUjmeZRCEA7ku01GfGqNRHf4DuiCvzgwNgWy42WSQ3A8Y6IB4W8O1Eww%3D%3D_V2&loc=IN&title=Solutions+Architect", [null, "<ul>\n<li>Partner with customer product, clinical, and engineering stakeholders to translate complex healthcare and life sciences requirements into production-grade architectures and directly drive implementation engineering production-level code, building core agentic/RAG and data pipelines.</li>\n<li>Serve as the lead architectural advisor on strategic engagements, guiding design decisions, unblocking complex engineering challenges through coding, debugging, and performance tuning, data, infrastructure, and AI practices to ensure interoperability.</li>\n<li>Define and build standardized reference architectures, reusable Agentic workflows, and technical blueprints aligned to priority HCLS transformation themes.</li>\n<li>Architect and implement verifiable AI evaluation frameworks, PHI data-protection boundaries, source-citation grounding, human-in-the-loop governance into customer solutions.</li>\n<li>Collaborate with Google Cloud Product Management, Customer Engineering, and Regional Consulting teams to scope strategic engagements.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree in Computer Science, Biomedical Informatics, Engineering, a related technical field, or equivalent practical experience.</li>\n<li>3 years of experience as an Enterprise/Solutions Architect, Principal Engineer, or Technical Lead designing and delivering enterprise systems in a cloud environment.</li>\n<li>Experience with healthcare interoperability, data standards, and regulatory/compliance frameworks across North America and EMEA markets.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li><div>Master’s degree in Computer Science, Health Informatics, Computational Biology or a related technical field.</div></li>\n<li>Experience designing hybrid enterprise architectures that combine business rules and data pipelines with multi-agent orchestration and LLM reasoning to meet strict accuracy, auditability, and latency SLAs.</li>\n<li><div>Architectural and implementation experience with Google Cloud’s AI, Data, and Healthcare stack (e.g., Vertex AI, Gemini, Agent Development Kit (ADK), BigQuery, and Cloud Healthcare API).</div></li>\n<li><div>Demonstrated ability to be a SME, advising executive stakeholders, aligning product requirements documents and statements of work, and guiding cross-functional and global systems integrator engineering teams through code reviews, technical debugging, and problem-solving.</div></li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"], "Bengaluru", "560038", "KA", "IN"], ["Gurugram, Haryana, India", ["Gurugram, Haryana, India"], "Gurugram", null, "HR", "IN"], ["Hyderabad, Telangana, India", ["Hyderabad, Telangana, India"], "Hyderabad", null, "TS", "IN"]], [null, "<p>The Google Cloud Platform team helps customers transform and build what's next for their business — all with technology built in the cloud. Our products are developed for security, reliability and scalability, running the full stack from infrastructure to applications to devices and hardware. Our teams are dedicated to helping our customers — developers, small and large businesses, educational institutions and government agencies — see the benefits of our technology come to life. As part of an entrepreneurial team in this rapidly growing business, you will play a key role in understanding the needs of our customers and help shape the future of businesses of all sizes use technology to connect with customers, employees and partners.</p>\n<p>As a Solutions Architect in GSD Industry Solutions (Healthcare and Life Sciences), you will combine deep HCLS domain fluency with direct Google Cloud and Generative/Agentic AI engineering expertise to take qualified, complex customer opportunities from defining requirements and architecting solutions through coding, rapid prototyping, implementation, and production rollout.</p><div>You will engage directly with customer C-suite, product, clinical, and engineering leaders to architect and build end-state cloud and agentic systems. Operating in a capacity, you will establish technical blueprints on strategic industry priorities, provide technical direction across cross-practice and partner delivery teams, write and review production-grade code for core architectural components aligned to the target architecture, and codify field-proven patterns into repeatable reference architectures, industry agents, and service offerings.</div><p>Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.</p>"], [2, 3], [1794915766, 226000000], [1794915766, 226000000], [1794915766, 283000000], [null, "In most instances, this position requires in-person interviews as part of the hiring process."], null, null, [null, "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Bengaluru, Karnataka, India; Gurugram, Haryana, India; Hyderabad, Telangana, India</b>."], [null, "<ul>\n<li>Bachelor’s degree in Computer Science, Biomedical Informatics, Engineering, a related technical field, or equivalent practical experience.</li>\n<li>3 years of experience as an Enterprise/Solutions Architect, Principal Engineer, or Technical Lead designing and delivering enterprise systems in a cloud environment.</li>\n<li>Experience with healthcare interoperability, data standards, and regulatory/compliance frameworks across North America and EMEA markets.</li>\n</ul>"], 2]], null, 41, 20], sideChannel: {}});</script></body></html>
